# A **scoped** cosmic-ray session: `render_temporal` and `widen`.
#
#   uv run python scripts/mutation.py cosmic-ray \
#       --config cosmic-ray-render.toml --rows 530:599 --session render.sqlite
#
# The two functions are 239 of `temporal_parsing.py`'s 850 mutants -- the
# largest unrun region by some margin, and the one BACKLOG B54 predicts will
# be the same shape as the three findings before it: arithmetic exercised at
# exactly one value, where a wrong implementation happens to agree.
#
# The classes named below are the ones that reach them. `TestProperties`
# carries the round-trip property, which is what `render_temporal` exists for
# at all -- and it is the reason this command is not narrowed further: a
# render mutant that survives the examples is exactly what the property is
# supposed to catch. Against the full file a mutant costs ~70s; scoped, ~7s.

[cosmic-ray]
module-path = "src/redstring/domain/temporal_parsing.py"
timeout = 30.0
test-command = "uv run pytest -x -q --no-header -p no:randomly tests/unit/domain/test_temporal_parsing.py -k 'TestWiden or TestRenderDeclines or TestProperties or TestPrecision'"
excluded-modules = []

[cosmic-ray.distributor]
name = "local"
