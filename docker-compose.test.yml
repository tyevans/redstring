# Test backends redstring owns. Start them deliberately:
#
#     docker compose -f docker-compose.test.yml up -d
#     KG_COMPLIANCE_MAX_EXAMPLES=10 uv run pytest -m integration
#
# Or name one service -- no integration test needs both:
#
#     docker compose -f docker-compose.test.yml up -d neo4j
#     docker compose -f docker-compose.test.yml up -d postgres
#
# Ports avoid 7687/5432/5433 so nothing collides with a local install or with
# another project's containers.
#
# No `apoc`. The Neo4j GraphStore adapter is plain Cypher: entity type is a
# property rather than a label, so `apoc.create.addLabels` is not needed, and
# traversal is a variable-length path rather than `apoc.path.subgraphAll`.
# Requiring a plugin would narrow which managed Neo4j offerings can host this
# library.
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/kgbuilder
    ports: ["7688:7687", "7475:7474"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p kgbuilder 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: kgbuilder
      POSTGRES_DB: kgbuilder_test
    ports: ["5434:5432"]
    # Same reason as neo4j's: `up -d` returns when the container is running,
    # not when the server can serve, so an immediate connect races. `-d` names
    # the database because `pg_isready` with no arguments succeeds against the
    # bootstrap server before `POSTGRES_DB` has been created.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kgbuilder_test"]
      interval: 5s
      timeout: 5s
      retries: 30
