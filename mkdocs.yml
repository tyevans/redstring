site_name: redstring
site_description: Build a knowledge graph from documents you already have — extraction, consolidation, and pluggable graph and vector storage.
site_url: https://tyevans.github.io/redstring
repo_url: https://github.com/tyevans/redstring
repo_name: tyevans/redstring
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'

# `docs/plans/` and `docs/history/` are the migration's own record -- written
# for the people who did it, dense with slice numbers and commit ranges, and
# actively misleading to a reader looking for how the library works today.
# They stay in the repository (README and BACKLOG both cite them) and out of
# the site.
exclude_docs: |
  plans/
  history/

# `--strict` turns a link to a missing page into a build failure, which is the
# point rather than a preference: this project renumbered seven ADRs by
# renaming the files and left 43 inbound links pointing at paths that no
# longer existed, and nothing anywhere reported it. See
# `.claude/rules/recurring-defects.md` §6.
strict: true

# `strict: true` promotes WARNING to an error, and **anchors were reported at
# INFO** -- so a link to `page.md#heading-that-was-renamed` did not fail the
# build even though a link to a missing *page* did. That gap was precisely the
# half of the ADR renumber that went unnoticed: 71 in-page anchors resolving
# nowhere, found by a one-off sweep rather than by the gate that was supposed
# to make the sweep unnecessary. Turning this on surfaced 48 more.
#
# A gate that catches missing files and shrugs at missing anchors is the more
# dangerous kind, because the sweep it does catch is what earns it the trust it
# then fails to deserve.
validation:
  anchors: warn
  links:
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  # GitHub's slug algorithm, not python-markdown's. Every page here was
  # written and cross-linked in a GitHub checkout, where `### \`uv sync
  # --all-extras\`, not \`--extra dev\`` anchors as
  # `#uv-sync---all-extras-not---extra-dev` -- python-markdown's default
  # collapses the runs and yields `#uv-sync-all-extras-not-extra-dev`, which
  # broke 71 in-page links at once. Matching GitHub keeps one set of anchors
  # correct in both places, which is the only arrangement that stays true.
  - toc:
      permalink: true
      # A factory, not a function -- `!!python/name:` hands mkdocs the
      # builder itself and every heading fails with "slugify() takes 0
      # positional arguments". `!!python/object/apply` calls it.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      separator: "-"

