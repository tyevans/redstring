default_install_hook_types: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # `mkdocs.yml` uses `!!python/object/apply:` to pass a slugify factory
        # to the toc extension, and safe-load rejects the tag outright. The
        # usual fix is `args: [--unsafe]`, which turns this hook into a
        # syntax-only check for *every* YAML file in the repo -- paying for one
        # file with the CI workflows and docker-compose.
        #
        # Excluded instead, and it loses nothing: `mkdocs build --strict` parses
        # this file with the tags resolved and fails on far more than
        # well-formedness, so it is the better-validated YAML here rather than
        # the unvalidated one. That build runs in CI and is not optional.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: check-docstring-first

  # Everything below runs out of the project's uv environment so the versions
  # match what `uv run` uses locally and in CI.
  - repo: local
    hooks:
      # Both ruff hooks run over the WHOLE repository and take no filenames,
      # because that is what CI runs (`ruff check .`, `ruff format --check .`)
      # and the two must not be able to disagree about scope.
      #
      # They previously disagreed, and it cost five red pull requests at once.
      # The hooks passed filenames under `types_or: [python, pyi]`, so a `.md`
      # file was never handed to ruff; CI passed `.`, so it was. When ruff
      # gained formatting for Python blocks *inside markdown*, 22 documentation
      # files became unformatted by CI's definition and correctly formatted by
      # the hook's -- and every Dependabot PR failed on `ruff format --check`
      # for a file its diff had not touched. Five unrelated bumps, one cause,
      # none of them the dependency.
      #
      # `types_or` still decides *whether* the hooks run; `pass_filenames:
      # false` decides *what they look at* once they do. `markdown` is in the
      # list so editing docs triggers them.
      #
      # `tests/unit/test_quality_gates_agree.py` asserts these two entries and
      # the CI steps stay the same command. Change one and that test fails.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, markdown]
        pass_filenames: false
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, markdown]
        pass_filenames: false
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -q
        language: system
        types: [python]
        exclude: ^tests/
        require_serial: true

      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)
        require_serial: true

      # The suite does NOT run here. It ran on every commit touching `src/` or
      # `tests/` and duplicated CI's `pytest` job exactly -- `addopts` already
      # deselects `integration` and `accuracy`, so both invocations selected
      # the same tests -- while costing minutes on every commit of a
      # many-small-commits workflow.
      #
      # **What that hook did beyond running the suite is the part to keep in
      # view.** `scripts/coverage_ratchet.py` compared total coverage against
      # `.coverage-baseline` and raised it when it rose, and CI ran no such
      # comparison: it collected coverage and uploaded it. Deleting the hook
      # without moving the floor would have removed the ratchet from the
      # project entirely, and nothing would have said so -- coverage would
      # simply have been free to fall. So CI's `pytest` job now passes
      # `--cov-fail-under="$(cat .coverage-baseline)"`, which enforces the same
      # floor one step later.
      #
      # The half that did not survive the move: the baseline no longer rises by
      # itself. `write_baseline` staged the new value into the commit that
      # earned it, and a CI run has no commit to stage into. Raising it is now
      # a deliberate edit -- see BACKLOG B-RATCHET-1.
