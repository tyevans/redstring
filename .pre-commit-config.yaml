default_install_hook_types: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # `mkdocs.yml` uses `!!python/object/apply:` to pass a slugify factory
        # to the toc extension, and safe-load rejects the tag outright. The
        # usual fix is `args: [--unsafe]`, which turns this hook into a
        # syntax-only check for *every* YAML file in the repo -- paying for one
        # file with the CI workflows and docker-compose.
        #
        # Excluded instead, and it loses nothing: `mkdocs build --strict` parses
        # this file with the tags resolved and fails on far more than
        # well-formedness, so it is the better-validated YAML here rather than
        # the unvalidated one. That build runs in CI and is not optional.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: check-docstring-first

  # Everything below runs out of the project's uv environment so the versions
  # match what `uv run` uses locally and in CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -q
        language: system
        types: [python]
        exclude: ^tests/
        require_serial: true

      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)
        require_serial: true

      - id: pytest-coverage-ratchet
        name: pytest + coverage ratchet
        entry: uv run python scripts/coverage_ratchet.py
        language: system
        pass_filenames: false
        files: ^(src/|tests/|pyproject\.toml$|scripts/coverage_ratchet\.py$)
        require_serial: true
