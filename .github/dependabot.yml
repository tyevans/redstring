# Pinning actions to a commit SHA is only half of the practice. The other half
# is something that raises the pin, or the workflows quietly run a year-old
# action with a year of unpatched bugs -- a pinned-and-abandoned dependency is
# not more secure than an unpinned one, it just fails differently.
#
# Dependabot rewrites both the SHA and the trailing `# vX.Y.Z` comment, so the
# comments stay honest without anyone maintaining them.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the routine bumps. The publishing action is deliberately
      # left out of the group: it is the one with `id-token: write` in reach,
      # and it deserves its own PR and its own read of the diff rather than
      # being approved alongside four checkout bumps.
      actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'pypa/gh-action-pypi-publish'
    commit-message:
      prefix: 'Bump'

  # Python dependencies. `uv.lock` is not committed, so this only sees the
  # declared ranges in `pyproject.toml`.
  #
  # `versioning-strategy: widen` is the important line, and it is here because
  # the default was actively wrong for a library. Dependabot's default raises
  # the *floor* -- `httpx>=0.25.0` becomes `httpx>=0.28.1` -- which for an
  # application is harmless and for a library is a narrowing: every consumer
  # pinned below the new floor can no longer install redstring, in exchange
  # for nothing, since the code needed no new version. The first batch of
  # five PRs included one raising the floor on a dependency that had no
  # importer at all, and one moving the neo4j driver to `>=6.2.0,<7`, which
  # would have dropped every user still on driver 5.
  #
  # `widen` proposes extending a range to admit the new release instead, which
  # is the change a library actually wants: more consumers can install it, not
  # fewer.
  #
  # The tooling extras are pinned exactly, and `widen` leaves an `==` pin
  # alone -- so those still arrive as ordinary version bumps, which is right:
  # for tools the pin *is* the point.
  - package-ecosystem: uv
    directory: /
    versioning-strategy: widen
    schedule:
      interval: monthly
    commit-message:
      prefix: 'Bump'
