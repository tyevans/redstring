# CI
#
# Every job installs with `uv sync --all-extras` and runs tools through
# `uv run`, so CI executes the same versions the pre-commit gate uses locally.
#
# `--all-extras`, never `--extra dev`. The `dev` extra holds only tooling;
# `neo4j` and `llm` are separate, and a venv without them fails *collection*
# on the modules that import them rather than skipping those tests. That
# mistake does not present as a packaging problem -- it has previously
# presented here as a mutation run reporting "0 survivors out of 426" and as
# 47 phantom mypy errors in untouched files.
#
# There is deliberately no `--locked`: `uv.lock` is not committed (it is in
# `.gitignore`), which is a defensible choice for a library -- resolving
# runtime dependencies fresh is how you find out that a new `pydantic` broke
# you, rather than finding out from a user.
#
# That argument covers runtime dependencies only. The `dev` and `docs` extras
# are **pinned exactly** in `pyproject.toml`, because a floating tool version
# means this gate can change under a branch that changed nothing -- which is
# not hypothetical here: a ruff release once turned five unrelated Dependabot
# PRs red at once, each on a file its diff had not touched.
#
# Third-party actions are pinned to a full commit SHA, with the tag in a
# trailing comment. A tag is a mutable pointer: whoever controls the action
# repository can move it, and a workflow with `id-token: write` anywhere near
# it is worth that attention. Dependabot updates the SHA and rewrites the
# comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here elevates it.
permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true

      - run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  type-check:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true

      - run: uv sync --all-extras

      # No paths on the command line. Naming files explicitly bypasses the
      # configured file set and answers a different question than the run this
      # project actually gates on -- the same trap as measuring a lint
      # exemption through the exemption.
      - run: uv run mypy

  import-linter:
    name: architecture contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true

      - run: uv sync --all-extras

      - run: uv run lint-imports

  audit:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true

      - run: uv sync --all-extras

      # `-r src/` scans the whole package. The pre-commit hook passes only the
      # filenames a commit touched, so it can be green for years without
      # having seen most of the tree -- which is exactly what happened here
      # until a rename touched every file at once and surfaced eight
      # pre-existing findings. This job is the one that sees all of it.
      - name: bandit
        run: uv run bandit -c pyproject.toml -r src/

      - name: pip-audit
        run: uv run pip-audit

  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --all-extras

      # `addopts` already deselects `integration` and `accuracy`, so this is
      # the same selection the commit gate runs.
      - name: pytest
        run: |
          uv run pytest -n auto --dist worksteal \
            --cov=src/redstring --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docs:
    name: mkdocs --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true

      - run: uv sync --all-extras

      # Runs on every PR rather than only on docs paths: a link into `docs/`
      # breaks when the *target* moves, so a change that touches no markdown
      # at all can still break the site. This is the check that would have
      # caught seven ADRs renamed without their inbound links.
      - run: uv run mkdocs build --strict

  # Backends from `docker-compose.test.yml`, on pushes to main only -- these
  # are minutes rather than seconds. The LLM subset is excluded because it
  # needs a live model, which no runner has.
  integration:
    name: integration (neo4j + pgvector)
    runs-on: ubuntu-latest
    needs: [lint, type-check, import-linter, audit, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/redstring
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p redstring 'RETURN 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: redstring
          POSTGRES_DB: redstring_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d redstring_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true

      - run: uv sync --all-extras

      # Three constraints, each measured rather than assumed:
      #
      # - **No `-n auto`.** `tests/integration/graph/` wipes one shared Neo4j
      #   database per test (`MATCH (n) DETACH DELETE n`), so parallel workers
      #   delete each other's data mid-test: 36 failures, none about the code.
      #   BACKLOG B10f.
      # - **Not in the same invocation as the unit suite.** A unit and an
      #   integration subclass of one compliance suite are two executors of the
      #   same function object, which trips hypothesis's differing-executors
      #   health check: 34 failures reading as flakiness. BACKLOG B10m.
      # - **`--cov-fail-under=0`.** The ratchet is calibrated against the unit
      #   suite; this job measures a partial selection and would always fail
      #   against a whole-suite threshold.
      - name: pytest -m integration
        env:
          KG_COMPLIANCE_MAX_EXAMPLES: '10'
          KG_TEST_NEO4J_URI: bolt://localhost:7688
          KG_TEST_NEO4J_USER: neo4j
          KG_TEST_NEO4J_PASSWORD: redstring
          KG_TEST_POSTGRES_DSN: postgresql://postgres:redstring@localhost:5434/redstring_test
        run: uv run pytest -m integration --cov-fail-under=0
