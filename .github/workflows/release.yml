# Release
#
# Publishes to PyPI when a `v*` tag is pushed.
#
#   v0.1.0     -> PyPI,     stable release
#   v0.1.0rc1  -> PyPI,     marked pre-release
#   v0.1.0a1   -> TestPyPI, marked pre-release
#   v0.1.0b1   -> TestPyPI, marked pre-release
#
# ## No API token exists
#
# Publishing uses PyPI **Trusted Publishing**: the job mints a short-lived
# OIDC identity that PyPI exchanges for a scoped, minutes-long upload token.
# There is no secret in this repository to leak, rotate, or accidentally print
# -- which is the whole argument for it over a long-lived `PYPI_API_TOKEN`
# that any workflow (or any workflow a dependency injects a step into) can
# read.
#
# The identity PyPI checks is the four-tuple (owner, repository, workflow
# filename, environment). **Renaming this file breaks publishing**, and does
# so in a way that reads as an authentication error rather than a rename.
#
# ## Provenance
#
# `gh-action-pypi-publish` >= 1.11 generates PEP 740 attestations
# automatically under Trusted Publishing. Each uploaded file gets a
# Sigstore-backed statement binding it to this workflow in this repository,
# signed with a short-lived key bound to the OIDC identity rather than to a
# maintainer's keyring. PyPI shows a "Provenance" badge on the release files
# and exposes the signing identity through its Integrity API. Nothing needs
# enabling; publishing with a token instead is what would turn it off.
#
# ## One-time setup, before the first tag
#
# The project does not exist on PyPI yet, so an ordinary trusted publisher
# cannot be added to it. Register a **pending publisher** instead:
#
#   https://pypi.org/manage/account/publishing/
#     PyPI project name:  redstring
#     Owner:              tyevans
#     Repository:         redstring
#     Workflow name:      release.yml
#     Environment:        pypi
#
# Repeat at https://test.pypi.org/manage/account/publishing/ with environment
# `testpypi`. Then create both environments under Settings -> Environments.
# The environments are optional to PyPI and *strongly* recommended: they are
# where a required-reviewer rule lives, which is the difference between a
# stray tag publishing itself and a stray tag waiting for a human.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Fails before anything is built if the tag and the packaged version
  # disagree. Catching it here costs a re-tag; catching it after upload costs
  # a version number, because PyPI does not allow re-uploading a filename.
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      publish_target: ${{ steps.version.outputs.publish_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify the tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          # Order matters: `rc` must be tested before the `(a|b)` pattern,
          # which would otherwise never be reached for a tag containing both.
          if [[ "$TAG" =~ rc[0-9]+$ ]]; then
            echo "is_prerelease=true"     >> "$GITHUB_OUTPUT"
            echo "publish_target=pypi"    >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ (a|b)[0-9]+$ ]]; then
            echo "is_prerelease=true"     >> "$GITHUB_OUTPUT"
            echo "publish_target=testpypi" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false"    >> "$GITHUB_OUTPUT"
            echo "publish_target=pypi"     >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'

      - name: Tag must match pyproject.toml
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(uv run --no-project python -c \
            'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [[ "${{ steps.version.outputs.version }}" != "$PROJECT_VERSION" ]]; then
            echo "::error::Tag v${{ steps.version.outputs.version }} does not match pyproject.toml ($PROJECT_VERSION)"
            exit 1
          fi
          echo "Version validated: $PROJECT_VERSION"

      - name: CHANGELOG must have a section for this version
        run: |
          set -euo pipefail
          if ! grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section"
            exit 1
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'

      - run: uv build

      # A wheel can be built, uploaded and installed while missing a file the
      # package needs -- hatchling selects files, and a selection bug is
      # invisible in a source checkout where everything is on disk anyway.
      # This installs the actual artifact into a clean environment and asks it
      # for the three things a source tree cannot vouch for: that the public
      # API imports, that the bundled YAML schemas came along, and that the
      # PEP 561 marker is present so downstream type checkers see any of the
      # annotations. `tests/integration/test_wheel_contents.py` is the same
      # check with more cases; this is the last gate before upload.
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python - <<'EOF'
          import pathlib
          import redstring
          from redstring import build_graph, domain_system_prompt, Entity, InMemoryGraphStore  # noqa: F401

          assert "site-packages" in redstring.__file__, redstring.__file__
          assert (pathlib.Path(redstring.__file__).parent / "py.typed").is_file(), "no py.typed in the wheel"
          assert domain_system_prompt("news_journalism").strip(), "bundled schemas missing from the wheel"
          print(f"Wheel smoke test passed: redstring {redstring.__version__}")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: [validate, build]
    if: needs.validate.outputs.publish_target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/redstring
    permissions:
      id-token: write        # mint the OIDC token Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # No `password:`. Absent one, the action performs the OIDC exchange and
      # attaches PEP 740 attestations. Adding a token would silently turn both
      # off.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    needs: [validate, build]
    if: needs.validate.outputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/redstring
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    needs: [validate, build, publish-pypi, publish-testpypi]
    # One of the two publish jobs is always skipped, so `success()` would never
    # be true here. Require that the one which ran, succeeded.
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.publish-pypi.result != 'failure'
      && needs.publish-testpypi.result != 'failure'
      && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Extract this version's changelog section
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          # Everything between this version's heading and the next one.
          # `validate` has already proved the section exists.
          {
            echo "content<<CHANGELOG_EOF"
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { flag = 1; next }
              /^## \[/ { flag = 0 }
              flag
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          generate_release_notes: false
          body: |
            ${{ steps.changelog.outputs.content }}

            ## Install

            ```bash
            pip install redstring==${{ needs.validate.outputs.version }}
            ```

            [Documentation](https://tyevans.github.io/redstring) ·
            [Changelog](https://github.com/tyevans/redstring/blob/main/CHANGELOG.md)

  # Publishing can report success while the index serves something unusable.
  # Install the *published* artifact from the *real* index and use it.
  #
  # Runs for **both** targets. Verifying only the PyPI path would be exactly
  # backwards: the TestPyPI tag exists to rehearse this pipeline on a version
  # nobody minds burning, and a rehearsal that skips the last step proves less
  # than the performance it is rehearsing for.
  verify:
    needs: [validate, publish-pypi, publish-testpypi]
    if: >-
      always()
      && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'

      - name: Wait for the index to propagate
        run: sleep 60

      - name: Install from the index it was published to, and use it
        env:
          TARGET: ${{ needs.validate.outputs.publish_target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          uv venv /tmp/verify

          # TestPyPI does not mirror PyPI, so it needs the real index as well
          # or the install fails resolving `pydantic` -- telling you nothing
          # about this package.
          #
          # `unsafe-best-match` is load-bearing and its name is alarming, so:
          # uv's default is `first-index`, meaning the first index that has a
          # package at all wins outright. TestPyPI carries stale copies of
          # plenty of real packages, so the default would resolve
          # dependencies against whatever ancient `pydantic` happens to sit
          # there and verify redstring against a dependency set no user will
          # ever have. `unsafe-best-match` considers every index and takes the
          # best version, which is what makes this a rehearsal rather than a
          # different experiment.
          #
          # It is "unsafe" because across two indexes it opens the door to
          # dependency confusion -- an attacker publishing a higher version of
          # a private name on a public index. That is not a risk here: every
          # name involved is public, and `redstring` itself is pinned to an
          # exact version that exists on exactly one of the two indexes.
          if [[ "$TARGET" == "testpypi" ]]; then
            INDEX_ARGS=(
              --index-url https://test.pypi.org/simple/
              --extra-index-url https://pypi.org/simple/
              --index-strategy unsafe-best-match
            )
          else
            INDEX_ARGS=()
          fi

          uv pip install --python /tmp/verify/bin/python \
            "${INDEX_ARGS[@]}" "redstring==${VERSION}"

          /tmp/verify/bin/python - <<'EOF'
          import asyncio
          from uuid import uuid4

          from redstring import FakeLlmProvider, InMemoryGraphStore, SourceDocument, build_graph

          ANSWER = {
              "entities": [{"name": "Ada Lovelace", "entity_type": "Person"}],
              "relationships": [],
          }

          async def main() -> None:
              tenant_id = uuid4()
              store = InMemoryGraphStore()
              await build_graph(
                  SourceDocument(id="smoke", text="Ada Lovelace wrote the first algorithm."),
                  provider=FakeLlmProvider(by_substring={"Ada": ANSWER}),
                  store=store,
                  tenant_id=tenant_id,
              )
              people = await store.find_entities(tenant_id, entity_type="Person")
              assert [e.name for e in people] == ["Ada Lovelace"], people

          asyncio.run(main())
          print("Published artifact builds a graph.")
          EOF
