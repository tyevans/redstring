# Release
#
# Publishes to PyPI when a `v*` tag is pushed.
#
#   v0.1.0     -> PyPI,     stable release
#   v0.1.0rc1  -> PyPI,     marked pre-release
#   v0.1.0a1   -> TestPyPI, marked pre-release
#   v0.1.0b1   -> TestPyPI, marked pre-release
#
# ## No API token exists
#
# Publishing uses PyPI **Trusted Publishing**: the job mints a short-lived
# OIDC identity that PyPI exchanges for a scoped, minutes-long upload token.
# There is no secret in this repository to leak, rotate, or accidentally print
# -- which is the whole argument for it over a long-lived `PYPI_API_TOKEN`
# that any workflow (or any workflow a dependency injects a step into) can
# read.
#
# The identity PyPI checks is the four-tuple (owner, repository, workflow
# filename, environment). **Renaming this file breaks publishing**, and does
# so in a way that reads as an authentication error rather than a rename.
#
# ## Provenance
#
# `gh-action-pypi-publish` >= 1.11 generates PEP 740 attestations
# automatically under Trusted Publishing. Each uploaded file gets a
# Sigstore-backed statement binding it to this workflow in this repository,
# signed with a short-lived key bound to the OIDC identity rather than to a
# maintainer's keyring. PyPI shows a "Provenance" badge on the release files
# and exposes the signing identity through its Integrity API. Nothing needs
# enabling; publishing with a token instead is what would turn it off.
#
# ## One-time setup, before the first tag
#
# The project does not exist on PyPI yet, so an ordinary trusted publisher
# cannot be added to it. Register a **pending publisher** instead:
#
#   https://pypi.org/manage/account/publishing/
#     PyPI project name:  redstring
#     Owner:              tyevans
#     Repository:         redstring
#     Workflow name:      release.yml
#     Environment:        pypi
#
# Repeat at https://test.pypi.org/manage/account/publishing/ with environment
# `testpypi`. Then create both environments under Settings -> Environments.
# The environments are optional to PyPI and *strongly* recommended: they are
# where a required-reviewer rule lives, which is the difference between a
# stray tag publishing itself and a stray tag waiting for a human.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Fails before anything is built if the tag and the packaged version
  # disagree. Catching it here costs a re-tag; catching it after upload costs
  # a version number, because PyPI does not allow re-uploading a filename.
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      publish_target: ${{ steps.version.outputs.publish_target }}
      dist_name: ${{ steps.version.outputs.dist_name }}
      install_cmd: ${{ steps.version.outputs.install_cmd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag trigger has no branch filter, and cannot have one: a tag is not
      # on a branch, and `on.push.tags` matches wherever the commit lives. So a
      # tag pushed from a feature branch publishes exactly as readily as one on
      # `main` -- it was nearly done here, on a branch whose pull request had
      # not merged yet.
      #
      # **The artifact would have been fine and the record would have been
      # wrong**, which is the harder failure to notice. The version validates,
      # the wheel builds, the upload succeeds -- and then the branch merges
      # under a new SHA, leaving a published release whose PEP 740 attestation
      # binds it to a commit that `git log main` does not contain. Provenance
      # pointing at an unreachable commit is worse than none: it looks like
      # evidence and cannot be followed.
      #
      # Nothing downstream can catch it. PyPI never permits reusing a filename,
      # so by the time the mismatch is visible the version number is spent.
      #
      # Asked through the API rather than with `git merge-base`, because
      # `persist-credentials: false` leaves the checkout without credentials to
      # fetch with, and re-enabling them to answer one question is a poor trade
      # in a workflow that mints an OIDC identity. `compare` reports the tagged
      # commit as `behind` or `identical` exactly when the base contains it.
      #
      # ## Why *protected*, and not `main`, and not `release/*`
      #
      # Requiring `main` alone rejects a legitimate `v0.1.1` cut from a
      # maintenance branch after `main` has moved on. The obvious widening --
      # accept anything matching `release/*` -- gives most of the hole back,
      # because a branch is cheap to create and "publishes from any branch
      # named release-something" is close to "publishes from anywhere".
      #
      # Asking the API which branches are *protected* keeps the property that
      # actually matters: **a release follows from a state someone reviewed.**
      # That is a claim about the repository's settings rather than about a
      # naming convention, and it cannot be satisfied by pushing a branch.
      #
      # Two consequences, both wanted. Unprotecting `main` breaks releasing,
      # which is the correct direction to fail. And a repository with no
      # protected branches at all publishes nothing -- the loop simply never
      # matches, so the fail-closed case needs no special handling beyond
      # saying why.
      #
      # What this does *not* check is how strong the protection is; a branch
      # protected without a review requirement still counts. Tightening that
      # means reading the protection rules, which is a different question from
      # the one this step exists to answer.
      - name: The tagged commit must be on a protected branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          BRANCHES=$(gh api --paginate \
            "repos/${REPO}/branches?protected=true&per_page=100" --jq '.[].name')

          if [ -z "$BRANCHES" ]; then
            echo "::error::${REPO} has no protected branches, so no tag can be shown to follow from a reviewed state. Protect the release branch before tagging."
            exit 1
          fi

          for BRANCH in $BRANCHES; do
            STATUS=$(gh api "repos/${REPO}/compare/${BRANCH}...${SHA}" --jq .status)
            case "$STATUS" in
              behind|identical)
                echo "Tagged commit ${SHA} is on protected branch ${BRANCH} (${STATUS})."
                exit 0
                ;;
            esac
            echo "Not on ${BRANCH} (${STATUS})."
          done

          echo "::error::Tagged commit ${SHA} is not on any protected branch (checked: $(echo $BRANCHES | tr '\n' ' ')). Merge first, then tag the merged commit."
          exit 1

      - name: Classify the tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          # Order matters: `rc` must be tested before the `(a|b)` pattern,
          # which would otherwise never be reached for a tag containing both.
          # `dist_name` is the name on the index, which is **not** `redstring`
          # on TestPyPI: that name is taken there by an unrelated project
          # (`RedString 0.0.1`, a different account). TestPyPI authorises an
          # upload against the project name in the distribution's metadata, so
          # publishing a `redstring` artifact there is a 403 no matter which
          # publisher is registered.
          #
          # The two indexes are separate namespaces and TestPyPI is a sandbox
          # anyone may squat, so this is a normal thing to hit rather than a
          # sign of trouble. The *import* name is unaffected: hatchling packages
          # `src/redstring`, so `redstring-test` installs and `import redstring`
          # works. Only the distribution name differs, which is exactly the
          # amount of divergence the rehearsal can tolerate -- see the rename
          # step in `build`.
          # Every output is set in exactly one branch. An earlier draft derived
          # `install_cmd` from a second `if` repeating the `(a|b)` test, which
          # is two places deciding one thing: the next tag scheme added here
          # would have had to be remembered twice, and a release note pointing
          # at the wrong index is not a failure anyone notices in CI.
          #
          # A release note whose install line does not work is worse than one
          # with no install line -- `pip install redstring-test==0.1.0a1`
          # resolves against PyPI, where that project does not exist, and the
          # error names the package rather than the missing index.
          TESTPYPI_INDEXES="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/"
          if [[ "$TAG" =~ rc[0-9]+$ ]]; then
            echo "is_prerelease=true"       >> "$GITHUB_OUTPUT"
            echo "publish_target=pypi"      >> "$GITHUB_OUTPUT"
            echo "dist_name=redstring"      >> "$GITHUB_OUTPUT"
            echo "install_cmd=pip install redstring==$TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ (a|b)[0-9]+$ ]]; then
            echo "is_prerelease=true"       >> "$GITHUB_OUTPUT"
            echo "publish_target=testpypi"  >> "$GITHUB_OUTPUT"
            echo "dist_name=redstring-test" >> "$GITHUB_OUTPUT"
            echo "install_cmd=pip install $TESTPYPI_INDEXES redstring-test==$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false"      >> "$GITHUB_OUTPUT"
            echo "publish_target=pypi"      >> "$GITHUB_OUTPUT"
            echo "dist_name=redstring"      >> "$GITHUB_OUTPUT"
            echo "install_cmd=pip install redstring==$TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'

      - name: Tag must match pyproject.toml
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(uv run --no-project python -c \
            'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [[ "${{ steps.version.outputs.version }}" != "$PROJECT_VERSION" ]]; then
            echo "::error::Tag v${{ steps.version.outputs.version }} does not match pyproject.toml ($PROJECT_VERSION)"
            exit 1
          fi
          echo "Version validated: $PROJECT_VERSION"

      - name: CHANGELOG must have a section for this version
        run: |
          set -euo pipefail
          if ! grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section"
            exit 1
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'

      # Only ever renames *away* from `redstring`, and only for TestPyPI.
      # The artifact that reaches PyPI is built from an unmodified tree.
      #
      # `exit 1` when the substitution changes nothing: a rename that silently
      # no-ops would produce a `redstring` artifact, fail at upload with a 403,
      # and send whoever reads it looking at publisher configuration instead of
      # at this step. An edit whose whole purpose is to change a file must fail
      # when the file does not change -- the same reasoning as an exemption list
      # that matches nothing.
      - name: Name the distribution for its index
        env:
          DIST_NAME: ${{ needs.validate.outputs.dist_name }}
        run: |
          set -euo pipefail
          if [[ "$DIST_NAME" == "redstring" ]]; then
            echo "Building as redstring; no rename."
            exit 0
          fi
          python - <<EOF
          import pathlib, sys
          name = "$DIST_NAME"
          p = pathlib.Path("pyproject.toml")
          before = p.read_text()
          after = before.replace('name = "redstring"', f'name = "{name}"', 1)
          if after == before:
              sys.exit("::error::could not rewrite the project name in pyproject.toml")
          p.write_text(after)
          print(f"Building as {name}.")
          EOF

      - run: uv build

      # A wheel can be built, uploaded and installed while missing a file the
      # package needs -- hatchling selects files, and a selection bug is
      # invisible in a source checkout where everything is on disk anyway.
      # This installs the actual artifact into a clean environment and asks it
      # for the three things a source tree cannot vouch for: that the public
      # API imports, that the bundled YAML schemas came along, and that the
      # PEP 561 marker is present so downstream type checkers see any of the
      # annotations. `tests/integration/test_wheel_contents.py` is the same
      # check with more cases; this is the last gate before upload.
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python - <<'EOF'
          import pathlib
          import redstring
          from redstring import build_graph, domain_system_prompt, Entity, InMemoryGraphStore  # noqa: F401

          assert "site-packages" in redstring.__file__, redstring.__file__
          assert (pathlib.Path(redstring.__file__).parent / "py.typed").is_file(), "no py.typed in the wheel"
          assert domain_system_prompt("news_journalism").strip(), "bundled schemas missing from the wheel"
          print(f"Wheel smoke test passed: redstring {redstring.__version__}")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: [validate, build]
    if: needs.validate.outputs.publish_target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/redstring
    permissions:
      id-token: write        # mint the OIDC token Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # No `password:`. Absent one, the action performs the OIDC exchange and
      # attaches PEP 740 attestations. Adding a token would silently turn both
      # off.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    needs: [validate, build]
    if: needs.validate.outputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/redstring
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    needs: [validate, build, publish-pypi, publish-testpypi]
    # One of the two publish jobs is always skipped, so `success()` would never
    # be true here. Require that the one which ran, succeeded.
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.publish-pypi.result != 'failure'
      && needs.publish-testpypi.result != 'failure'
      && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Extract this version's changelog section
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          # Everything between this version's heading and the next one.
          # `validate` has already proved the section exists.
          {
            echo "content<<CHANGELOG_EOF"
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { flag = 1; next }
              /^## \[/ { flag = 0 }
              flag
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          generate_release_notes: false
          body: |
            ${{ steps.changelog.outputs.content }}

            ## Install

            ```bash
            ${{ needs.validate.outputs.install_cmd }}
            ```

            [Documentation](https://tyevans.github.io/redstring) ·
            [Changelog](https://github.com/tyevans/redstring/blob/main/CHANGELOG.md)

  # Publishing can report success while the index serves something unusable.
  # Install the *published* artifact from the *real* index and use it.
  #
  # Runs for **both** targets. Verifying only the PyPI path would be exactly
  # backwards: the TestPyPI tag exists to rehearse this pipeline on a version
  # nobody minds burning, and a rehearsal that skips the last step proves less
  # than the performance it is rehearsing for.
  verify:
    needs: [validate, publish-pypi, publish-testpypi]
    if: >-
      always()
      && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'

      - name: Install from the index it was published to, and use it
        id: install
        env:
          TARGET: ${{ needs.validate.outputs.publish_target }}
          VERSION: ${{ needs.validate.outputs.version }}
          DIST_NAME: ${{ needs.validate.outputs.dist_name }}
        run: |
          set -euo pipefail
          uv venv /tmp/verify

          # TestPyPI does not mirror PyPI, so it needs the real index as well
          # or the install fails resolving `pydantic` -- telling you nothing
          # about this package.
          #
          # `unsafe-best-match` is load-bearing and its name is alarming, so:
          # uv's default is `first-index`, meaning the first index that has a
          # package at all wins outright. TestPyPI carries stale copies of
          # plenty of real packages, so the default would resolve
          # dependencies against whatever ancient `pydantic` happens to sit
          # there and verify redstring against a dependency set no user will
          # ever have. `unsafe-best-match` considers every index and takes the
          # best version, which is what makes this a rehearsal rather than a
          # different experiment.
          #
          # It is "unsafe" because across two indexes it opens the door to
          # dependency confusion -- an attacker publishing a higher version of
          # a private name on a public index. That is not a risk here: every
          # name involved is public, and `redstring` itself is pinned to an
          # exact version that exists on exactly one of the two indexes.
          if [[ "$TARGET" == "testpypi" ]]; then
            INDEX_ARGS=(
              --index-url https://test.pypi.org/simple/
              --extra-index-url https://pypi.org/simple/
              --index-strategy unsafe-best-match
            )
          else
            INDEX_ARGS=()
          fi

          # Installed by distribution name, imported as `redstring` below --
          # which is the point of doing it this way round. On the TestPyPI path
          # those two strings differ, so this step proves the wheel's import
          # package is independent of what the index calls it. A rehearsal that
          # installed `redstring` would not be testing the artifact that was
          # actually published.
          # Retried, not slept at. This step used to `sleep 60` and install
          # once, and v0.2.0 is where that lost: both files uploaded 200 OK,
          # the install ran 75 seconds later, and uv reported "there is no
          # version of redstring==0.2.0". The package was fine -- it resolved
          # and passed this exact smoke test by hand a few minutes afterwards.
          #
          # A fixed sleep is a guess at how long someone else's CDN takes, and
          # a guess that is usually right is the worst kind: it fails rarely,
          # after a successful publish, on the one job whose whole purpose is
          # to say whether the publish was good. It reads as a broken release
          # when nothing is broken, which invites re-running a workflow that
          # can never succeed twice on one version.
          #
          # `--refresh-package` is the other half, and it covers a *different*
          # cause with the same symptom: uv caches index responses, and
          # `UV_CACHE_DIR` here is restored by setup-uv from an earlier run
          # that may have looked this distribution up when the new version did
          # not exist. That failure does not heal with time -- no amount of
          # sleeping expires a cache -- so waiting alone could not have fixed
          # it. Which of the two actually bit v0.2.0 is not established; this
          # closes both, and the second costs one flag.
          ATTEMPTS=20
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if uv pip install --python /tmp/verify/bin/python \
                 --refresh-package "${DIST_NAME}" \
                 "${INDEX_ARGS[@]}" "${DIST_NAME}==${VERSION}" 2>&1 | tee /tmp/install.log
            then
              echo "Installed ${DIST_NAME}==${VERSION} on attempt ${attempt}."
              break
            fi

            # Bounded, and it names the cause when it gives up -- a step that
            # hangs or fails vaguely here reads as infrastructure trouble and
            # gets retried rather than investigated.
            if [[ "$attempt" -eq "$ATTEMPTS" ]]; then
              echo "::error::${DIST_NAME}==${VERSION} was published but did not become installable within ~10 minutes. The upload succeeded, so check whether the index is serving it (https://pypi.org/simple/${DIST_NAME}/) before assuming the artifact is bad; if it is listed there, this step is at fault and not the release."
              cat /tmp/install.log
              exit 1
            fi
            echo "Attempt ${attempt}/${ATTEMPTS}: not resolvable yet, waiting 30s."
            sleep 30
          done

          /tmp/verify/bin/python - <<'EOF'
          import asyncio
          from uuid import uuid4

          from redstring import FakeLlmProvider, InMemoryGraphStore, SourceDocument, build_graph

          ANSWER = {
              "entities": [{"name": "Ada Lovelace", "entity_type": "Person"}],
              "relationships": [],
          }

          async def main() -> None:
              tenant_id = uuid4()
              store = InMemoryGraphStore()
              await build_graph(
                  SourceDocument(id="smoke", text="Ada Lovelace wrote the first algorithm."),
                  provider=FakeLlmProvider(by_substring={"Ada": ANSWER}),
                  store=store,
                  tenant_id=tenant_id,
              )
              people = await store.find_entities(tenant_id, entity_type="Person")
              assert [e.name for e in people] == ["Ada Lovelace"], people

          asyncio.run(main())
          print("Published artifact builds a graph.")
          EOF
