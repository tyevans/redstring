name: Deploy Documentation & Living Visualizer to GitHub Pages (redstring)

on:
  push:
    branches: [main]
  workflow_dispatch:

# No default permissions. The deploy job is the only job, and it gets the
# three it needs. `id-token: write` is the grant that matters: it lets the job
# ask for an OIDC token, so every action and tool that runs in this job is
# pinned to a commit SHA.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build Diataxis Documentation and Living Visualizer
        # spec-ops publishes no tags, so the tool is pinned to a commit. A bare
        # `git+https://...` URL runs whatever the default branch holds at the
        # time of the push, with this job's OIDC grant. Move the SHA on
        # purpose, after you read the diff.
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: uv tool run --from "git+https://github.com/tyevans/spec-ops.git@2c8d073180eb558a57aeb500ffcc6210361c8ee7" spec-ops docs build --base-url "/${REPO_NAME}/"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
