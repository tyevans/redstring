# A **scoped** cosmic-ray session: the uncertainty and marker-stripping half of
# `domain/temporal_parsing.py`.
#
# Slice 8 mutated that module's precision logic (57 mutants) and left 793
# unrun, because a mutant against the default `test-command` costs ~70s: it
# re-runs the whole test file, which carries two hypothesis properties at 300
# examples and a `dateparser` import. 850 x 70s is about seventeen hours.
#
# **Split by target, not by patience.** The round-trip properties are the
# expensive part and they exercise `render_temporal` and the partial-date
# strategies -- nothing this session mutates. Aiming the command at the two
# classes that do cover it takes a mutant from ~70s to well under one, which
# is the difference between a run someone does and a run someone means to.
#
#   uv run python scripts/mutation.py cosmic-ray --config cosmic-ray-uncertainty.toml
#
# The wrapper reads `test-command` from *this* file for its baseline, so the
# narrower command is checked green before anything is mutated -- which is the
# whole reason the baseline is read from config rather than restated.
#
# cosmic-ray has no line filter, so `init` produces the module's full mutant
# set and the rows outside the region of interest are deleted from the session
# database afterwards:
#
#   sqlite3 session.sqlite \
#     "DELETE FROM work_items WHERE start_pos_row NOT BETWEEN 124 AND 205;"
#
# 124-205 is `_UNCERTAINTY_PATTERNS` through `_strip_markers`. Re-check those
# numbers against the module before relying on them; they are line numbers,
# and this comment is the kind of specific that decays.

[cosmic-ray]
module-path = "src/redstring/domain/temporal_parsing.py"
timeout = 30.0
test-command = "uv run pytest -x -q --no-header -p no:randomly tests/unit/domain/test_temporal_parsing.py -k 'TestUncertainty or TestEdgesOfTheStrategyChain'"
excluded-modules = []

[cosmic-ray.distributor]
name = "local"
