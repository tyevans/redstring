[project]
name = "redstring"
version = "0.11.0"
description = "Knowledge graph construction: entity extraction, consolidation, and pluggable graph and vector storage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ty Evans", email = "tyler@poorlythoughtout.com" }]
maintainers = [{ name = "Ty Evans", email = "tyler@poorlythoughtout.com" }]
requires-python = ">=3.13"
keywords = [
    "knowledge-graph",
    "entity-extraction",
    "entity-resolution",
    "event-sourcing",
    "graph-database",
    "llm",
    "neo4j",
    "pgvector",
]
# Trove classifiers are discoverability, not correctness: `requires-python`
# is what actually gates installation, and PyPI rejects an unknown string
# rather than ignoring it, so this list is deliberately short and every entry
# is one PyPI recognises.
#
# `Development Status :: 4 - Beta` rather than `3 - Alpha`: the API is gated
# by `__all__` and three tests (ADR 0006), the ports have compliance suites,
# and the whole surface is type-checked under `--strict`. It is not `5 -
# Production/Stable` because nothing has run this in production yet and the
# 0.x version says so.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12,<3",
    "python-dateutil>=2.9.0",
    "dateparser>=1.2.0",
    "pyyaml>=6.0",
    "jellyfish>=1.0.0",
    # Not an extra any more, as of slice 10. `redstring/__init__.py` exports
    # `build_graph`, `Document`, `DocumentExtracted` and the two projections,
    # and every one of those needs eventsource -- so `import redstring`
    # needed it, and a public API that fails to import without an extra is not
    # a public API. The events are the write model, not an optional backend.
    # The one-minor cap stays deliberate: this is a pre-1.0 library whose
    # entire API changed between 0.5 and 0.9, and which operates a stated
    # no-shim policy -- 0.12.0 alone renamed a keyword argument and changed an
    # abstract method's arity, neither with an alias. See BACKLOG B38.
    #
    # **0.13.0 is the counter-example to that cap's own justification, and it
    # is worth recording rather than quietly dropping.** It carries four
    # breaking changes -- in-memory stores reject unregistered event types at
    # append, `EventAppender.max_append_batch` is gone, and two read-model
    # filter behaviours changed -- and redstring needed **no edit for any of
    # them**. Every event here already carries `@register_event`, nothing
    # implements `EventAppender`, and this library uses no eventsource read
    # models. `StoreProjection`, `handles` and `replay` are untouched in
    # 0.13.0, so ADR 0020's adoption stands.
    #
    # That is an argument for keeping the one-minor cap, not for widening it:
    # the cap is what made someone read the changelog and find out. A clean
    # review is the cap working, not the cap being unnecessary.
    #
    # **The floor moved to 0.13.0 with the cap** rather than staying at
    # 0.12.0. Nothing here needs a 0.13.0 feature, so this is a deliberate
    # choice to carry one supported version rather than a range -- the
    # library is pre-1.0 on both sides and a two-version window is a two-
    # version test matrix nobody runs. `tests/integration/
    # test_declared_floors_work.py` installs the declared floor and builds a
    # projection, so the floor is the version that is actually exercised.
    #
    # The floor was 0.12.0 because `redstring/projections/` imports
    # `StoreProjection` from `eventsource.application.projections`, which does
    # not exist before it -- the first bump where the floor moved because
    # something here needed it rather than because the cap dragged it. Both
    # projections were built on a local copy of that class until 0.12.0
    # upstreamed it, together with the `replay` driver this package also used
    # to carry. See docs/adr/0020.
    #
    # The previous floor was 0.10.0, for `projections/base.py` forwarding
    # `retry_policy` and `tracer` to `DeclarativeProjection.__init__`, which
    # gained them in 0.10.0. `0.1.0` shipped declaring `>=0.9.1` -- a resolver
    # picking the low end got `TypeError: unexpected keyword argument
    # 'retry_policy'` at the first projection construction. Not at import, so
    # a smoke test that imports the package would not have caught it. That
    # file is now deleted and the hazard belongs to eventsource.
    #
    # Reported by a downstream project, not by this repository's own gates:
    # CI resolves fresh and therefore always tests the *newest* permitted
    # version, so a too-low floor is invisible here by construction. See
    # BACKLOG B70 for the check that would measure it.
    #
    # **0.14.0 is the other case, and it is the one that shows what the cap
    # actually buys.** It carries many breaking changes, and almost all of
    # them land in surface this library has never touched: subscriptions, the
    # three broker buses, read models, migration configuration, and the knobs
    # deleted from `ProjectionCoordinator`. Exactly one reaches this package,
    # and it reached the *documentation* rather than the code -- the
    # projections retry Protocol in
    # `eventsource.application.projections.retry` is now
    # `ProjectionRetryPolicy` rather than `RetryPolicy`, with no shim. Nothing
    # under `src/` imports it; a how-to named it in a signature, and that is
    # the whole cost of the adoption.
    #
    # The sharp edge is worth recording, because it is the reason a rename
    # with no shim is not self-announcing here: `from eventsource import
    # RetryPolicy` **still resolves**, to an unrelated and structurally
    # incompatible bus-backoff dataclass. So the reader who meets the
    # `ImportError` from the projections module and reaches for the top-level
    # export gets a name that imports and a type that cannot do the job. That
    # is an argument *for* the one-minor cap on the same terms as the 0.13.0
    # paragraph above: the cap is what made someone read the changelog, and
    # reading the changelog is the only thing that distinguishes those two
    # `RetryPolicy`s.
    #
    # **The floor moves to 0.14.0 with the cap**, for the reasoning already
    # written above -- one supported version rather than a range, because a
    # two-version window is a test matrix nobody runs.
    "eventsource-py>=0.14.0,<0.15",
]

[project.optional-dependencies]
# Both driver majors, verified rather than assumed: the full integration
# suite (118 tests, the shared compliance body plus this adapter's own) was
# run against a real Neo4j on 5.28.4 and on 6.2.0, and passes on both.
#
# The range is deliberately *wider* than Dependabot proposed. It opened a PR
# moving this to `>=6.2.0,<7`, which raises the floor -- for a library that
# means dropping every consumer still on driver 5 to gain nothing, since the
# adapter needs no 6.x feature. Supporting both is strictly better for a
# caller who has other reasons to pin.
#
# One behaviour genuinely differs, and it is a test concern rather than an
# adapter one: use-after-close warns on 5.x and raises `DriverError` on 6.x.
# `test_connect_owns_and_closes_its_driver` accepts either.
neo4j = ["neo4j>=5.27,<7"]
# The pgvector `VectorStore`. `asyncpg` is imported inside
# `PgVectorStore.connect` and under `if TYPE_CHECKING:` everywhere else, so
# the adapter module imports fine without it and only the one constructor
# that builds its own pool needs it present.
pgvector = ["asyncpg>=0.31.0"]
# The Redis `Cache`. Same shape as `pgvector` above: one function-local
# import, in `RedisCache.from_url`.
#
# `<9` rather than `<6`, and the four majors were run rather than reasoned
# about. `CacheCompliance` against a real Redis passes on clients **5.3.1,
# 6.4.0, 7.4.1 and 8.1.0** -- 26 tests each, including the `str`-not-`bytes`
# assertion that is the one this adapter could plausibly fail across a major.
# The old cap was absence of evidence, not a known incompatibility, and B41
# is what turned it into a measurement.
#
# Widening it also dissolves BACKLOG B38: `eventsource-py[all]` wants
# `redis>=8.0,<9.0`, which `<6` excluded outright. The two now resolve
# together, checked with a throwaway project rather than assumed.
redis = ["redis[hiredis]>=5.3,<9"]
# The LLM transport. `langchain-openai` speaks to any OpenAI-compatible
# server -- llama.cpp, llama-swap, vLLM, Ollama's shim, OpenAI itself -- so
# one extra covers every deployment this library has. Ranges rather than pins:
# the whole point of the `LlmProvider` port is that a breaking change touches
# `llm/adapters/langchain.py` and nothing else.
llm = [
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
]
# The port compliance suites, for an adapter written outside this repository.
# `redstring.testing` imports pytest and hypothesis at module scope; nothing
# else under `src/` imports either, which
# `tests/unit/test_dependencies_stay_confined.py` asserts in both directions.
#
# **Ranges, not exact pins, and this is not an oversight** -- read the block
# below before "fixing" it. The pinning rule underneath applies to *tooling*
# extras, which nobody installs alongside their own code. This one a consumer
# installs into the environment their own test suite runs in, so an exact
# `pytest==9.1.1` would not be a policy, it would be a conflict: any project
# already pinning a different pytest cannot install `redstring[test]` at all,
# and the suites do not use a feature narrow enough to justify that.
#
# `pytest-asyncio` is here because every case is a bare `async def`. Under its
# default strict mode those are collected and **skipped**, which reads as a
# pass -- so a consuming project must set `asyncio_mode = "auto"`. The
# dependency cannot set it; `redstring.testing`'s docstring says so and
# `docs/how-to/implement-a-store-adapter.md` says so.
test = [
    "hypothesis<7,>=6.100",
    "pytest>=8,<10",
    "pytest-asyncio<2,>=0.24",
]
all = [
    "redstring[neo4j,llm,pgvector,redis]",
]
# ---------------------------------------------------------------------------
# Tooling extras are PINNED EXACTLY. Runtime dependencies above are not.
# ---------------------------------------------------------------------------
#
# The asymmetry is the whole point, so it is worth stating rather than
# inferring. `uv.lock` is deliberately not committed (see `.gitignore`),
# because resolving runtime dependencies fresh on every CI run is how this
# library finds out that a new `pydantic` or `eventsource-py` broke it --
# rather than finding out from a user. That argument is about *runtime*
# dependencies and has never applied to `ruff`.
#
# Applied to tooling it does real damage, and did: with `ruff>=0.14`, a ruff
# release that grew a new capability turned **five unrelated Dependabot pull
# requests red at once**, every one of them on a documentation file its diff
# had not touched. The failure named the diff and was not about the diff,
# which is the response-shaping part -- the natural moves are to re-run it or
# to distrust the bump, and both are wrong.
#
# A floating tool version means the gate can change under a branch that
# changed nothing. Exact pins make a tool upgrade what it should be: its own
# commit, with its own diff, landing when someone chose it. Dependabot raises
# them (`.github/dependabot.yml`), so this is not a promise to stay behind.
#
# Do not "helpfully" widen these back to `>=`. The floors are not what was
# wanted; the *ceilings* are.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==11.0.1",
]
dev = [
    "bandit[toml]==1.9.4",
    "cosmic-ray==8.4.6",
    "coverage[toml]==7.15.3",
    "hypothesis==6.165.10",
    # Used only by `tests/integration/llm/test_live_endpoint.py`, to probe a
    # model server before the suite talks to it. Never imported by `src/`.
    "httpx==0.28.1",
    "import-linter==2.13",
    "mutmut==3.7.0",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-randomly==4.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.1",
    "types-dateparser==1.4.1.20260617",
    "types-python-dateutil==2.9.0.20260807",
    "types-pyyaml==6.0.12.20260815",
]

[project.urls]
Homepage = "https://github.com/tyevans/redstring"
Documentation = "https://tyevans.github.io/redstring"
Repository = "https://github.com/tyevans/redstring"
Issues = "https://github.com/tyevans/redstring/issues"
Changelog = "https://github.com/tyevans/redstring/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redstring"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "DTZ",    # flake8-datetimez -- tz-aware is a domain invariant here
    "ERA",    # eradicate (commented-out code)
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "TC",     # flake8-type-checking
    "TID",    # flake8-tidy-imports
]
# Kept, and empty: this project ignores no rule on `src/`. The last entry was
# `UP042` (rewrite `class X(str, Enum)` as `enum.StrEnum`), removed when the
# migration was made -- see `tests/unit/test_enum_values_are_a_wire_format.py`,
# which pins the values that must *not* move while `str(X.A)` does.
#
# Empty rather than deleted, unlike mypy's `exclude`: an empty `ignore` still
# states the position, so adding an entry is a visible decision in review. An
# *exclusion* over an empty set excludes nothing, which is why that one went.
# See `docs/adr/0014-exemption-lists-are-empty-and-must-stay-falsifiable.md`.
ignore = []
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",
    # Test functions do not earn return annotations: thousands of findings,
    # zero signal.
    "ANN",
    # hypothesis `st.datetimes(min_value=..., max_value=...)` bounds MUST be
    # naive, and strategies that generate naive datetimes to prove rejection
    # are the point. DTZ003 (utcnow) stays enforced everywhere.
    "DTZ001",
]

# The legacy-package exemption list is empty, and that is the point: every
# entry was removed in the commit that deleted or repaired its package.
# Slice 9 took `models`, `services`, `schemas`, `graph/client.py` and
# `graph/queries.py`; `events/**` went next (its ANN half exempted nothing at
# all and its TC half was covering for the `runtime-evaluated-base-classes`
# misconfiguration below). Slice 10 took the last one,
# `src/redstring/extraction/**` = ["ANN", "TC", "RET", "ERA"], together with
# its test-side twin.
#
# Measured with the entry deleted rather than through it, as CLAUDE.md
# requires: it was hiding ten findings across eight files, two of which were
# in `prompt_generator.generate_json_schema` and left with that function.
# BACKLOG B15, closed.

[tool.ruff.lint.isort]
known-first-party = ["bench", "redstring"]

# datetime.utcnow() returns a NAIVE datetime and is deprecated from 3.12.
# DTZ003 catches the call form but not a bare reference such as
# `default_factory=datetime.utcnow`, which is how it reached this codebase
# (BACKLOG B29). Banning the attribute catches both shapes.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "Naive and deprecated since 3.12 — use datetime.now(UTC)."
"datetime.datetime.utcfromtimestamp".msg = "Naive — use datetime.fromtimestamp(ts, UTC)."

[tool.ruff.lint.flake8-type-checking]
# Pydantic BaseModel subclasses resolve their field annotations at runtime
# (schema building), so imports feeding those annotations must stay real
# imports, not TYPE_CHECKING-guarded ones -- TC001/TC003 would otherwise
# flag imports whose removal breaks pydantic at import time.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    # Ruff matches the base class as *written in the file*, not through the
    # MRO, so it cannot tell that eventsource's event base is itself a pydantic
    # model -- every event class here declares `TenantDomainEvent` and got
    # TC001/TC002/TC003 on its field annotations as a result.
    #
    # Those are the dangerous kind of false positive: the suggested fix
    # compiles, imports, and breaks at model *use*. Measured -- moving
    # `from uuid import UUID` into a type-checking block in `events/merge.py`
    # (a fix ruff offers) leaves `import redstring.events.merge` succeeding
    # and then fails 23 tests with `PydanticUserError: MergeUndone is not
    # fully defined`, because `merge_event_id: UUID` is a field and pydantic
    # resolves field annotations when it builds the schema.
    "eventsource.domain.tenant_events.TenantDomainEvent",
]

[tool.mypy]
python_version = "3.13"
# Strict only where the new architecture lives. Legacy packages are excluded
# rather than weakened, and each exclusion dies with its package.
files = ["src/redstring"]
# No `exclude`. There was one, and slice 10 emptied it by fixing the last
# fourteen findings in `extraction/` rather than by deleting the package.
# CLAUDE.md's rule applies: an exclusion over an empty set excludes nothing
# and any guard written over it passes vacuously, so it is deleted rather than
# kept empty. Re-adding one is a visible decision.
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
# Pydantic 2.13 types well on its own, but the plugin adds checks plain mypy
# cannot do -- above all `init_typed`, which validates constructor CALLS
# against field types. Without it `Entity(confidence="high")` type-checks
# clean and only fails at runtime, which defeats the point of typing a
# domain model whose whole job is enforcing invariants.
plugins = ["pydantic.mypy"]

# asyncpg ships no `py.typed`, so mypy cannot see its types at all. The
# alternative is a stub package, which would have to track asyncpg's releases
# for the sake of one adapter; `redstring.vector.adapters.pgvector` is the
# only module that imports it, and its own signatures are fully annotated.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The accuracy suite measures extraction quality against a live LLM, and the
# integration suite runs the port-compliance tests against real backends from
# `docker-compose.test.yml`. Both are excluded from the default run (and so
# from the commit gate), which keeps it infra-free and fast. Run them
# deliberately -- a CLI `-m` overrides this one:
#
#     uv run pytest -m accuracy tests/accuracy/
#     KG_COMPLIANCE_MAX_EXAMPLES=10 uv run pytest -m integration
addopts = ["-m", "not accuracy and not integration"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "accuracy: extraction accuracy tests",
    # Narrower than `integration`: a container CI can start, an inference
    # endpoint it cannot. Every `live` test is also `integration`, so the
    # commit gate never sees one either way -- the marker exists so CI can
    # run `-m "integration and not live"` and skip the probes instead of
    # waiting out their timeouts against an address that does not answer.
    "live: needs an LLM or embeddings endpoint, which no CI runner has",
    "slow: tests that take a long time to run",
]

[tool.coverage.run]
source = ["src/redstring"]
branch = true
parallel = true
omit = [
    "*/__pycache__/*",
    # Deliberately NOT omitted: `graph/adapters/neo4j.py`. Most of it is
    # exercised by `tests/unit/graph/test_neo4j_adapter_is_wired.py`, which
    # runs in the default gate; the rest needs a server. Omitting it would
    # have hidden the untested remainder, which is the opposite of what a
    # ratchet is for. See BACKLOG B10a.
]

[tool.coverage.paths]
source = ["src/redstring", "*/src/redstring"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

# Mutation testing. Run on demand, not on commit -- see also cosmic-ray.toml,
# which covers decorated functions that mutmut 3.x refuses to mutate.
#   uv run mutmut run
#   uv run mutmut results
[tool.mutmut]
paths_to_mutate = ["src/redstring/"]
tests_dir = ["tests/unit/"]
runner = "uv run pytest -x -q --no-header -p no:randomly"
also_copy = ["pyproject.toml", "tests/conftest.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

# B101 (`assert_used`) is silenced for `redstring/testing/` and nowhere else.
#
# That package is the port compliance suites, which moved under `src/` so they
# could ship to adapter authors outside this repository. They are test bodies:
# `assert` is what they are made of, ~400 of them, and B101 exists to catch an
# `assert` load-bearing in *production* code, where `python -O` deletes it.
# Nothing here runs under `-O` in anyone's product.
#
# **A path skip, not `exclude_dirs`, and the difference is the whole point.**
# Excluding the directory would drop it from every bandit check, so a real
# finding -- a `subprocess` call, a hardcoded password, an `eval` -- would go
# unseen forever. This silences one test id over one path and leaves the other
# ~70 live: B311 in `vector_store.py` is still reported, and still carries a
# `# nosec` with its reasoning inline.
#
# `tests/unit/test_nosec_markers_are_live.py` guards this both ways: that the
# glob still matches a file, and that the file it matches still contains the
# `assert` statements the skip is for. An exemption over an empty set is the
# one CLAUDE.md says to delete.
[tool.bandit.assert_used]
skips = ["*/redstring/testing/*.py"]

[tool.importlinter]
root_packages = ["redstring"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
# `containers` + `exhaustive` (below) are what make this contract complete
# rather than merely correct: with them, a new top-level package under
# `redstring` fails the gate until it is placed on a layer. Layer names are
# relative to the container, which is why they are bare here.
containers = ["redstring"]
layers = [
    # `composition` is the top layer. It holds the modules that join two layers
    # forbidden from importing each other, and each membership has to name the
    # pair it joins. There are two:
    #
    #   - `build_graph` joins `extraction` and `projections`. That separation
    #     is what stops a store reference growing back into the pipeline, and
    #     yet something has to hold both, or the library ships two halves and
    #     a diagram.
    #   - `retrieval` joins `vector`, `graph` and `llm`. Those are siblings:
    #     `vector` and `graph` may not import each other and neither may
    #     import `llm`, so no sibling can hold all three.
    #
    # If a third module wants in here, ask what it composes -- a candidate
    # that cannot name such a pair is a piece of one half placed above it for
    # convenience. See the ADR amending 0007.
    # `testing` is above everything, and the direction is the point: nothing
    # under `src/` may import it, so `import redstring` can never reach
    # `pytest`. What it may import is constrained by the *forbidden* contract
    # below rather than by this one -- a layers contract can pin one direction
    # or the other and this package needs both pinned. Placing it at the top
    # and forbidding downward reaches is the pair that says what is meant:
    # the compliance suites test a *port*, so a suite reaching an adapter
    # would be checking one implementation while claiming to check the
    # contract.
    "testing",
    "composition",
    # `services` was the top layer and is gone as of slice 9. There
    # is no service layer any more: the write model is `aggregates` + `events`,
    # the read model is `projections`, and persistence is the two ports. A new
    # name here should be argued for, not added because something needs
    # somewhere to sit.
    # `llm` is a sibling of `extraction` rather than beneath it, and that is
    # the load-bearing part: siblings may not import each other, so extraction
    # can depend only on `ports.llm_provider`. Putting `llm` lower
    # would let extraction import the LangChain adapter directly and undo the
    # port. Note that import-linter cannot see the *external* langchain
    # imports; `tests/unit/test_dependencies_stay_confined.py` covers those.
    # `consolidation` joins the sibling line rather than sitting above
    # `extraction`. It needs nothing from extraction -- the tie-break both use
    # moved down to `domain.preference` when consolidation became its third
    # caller -- and putting it above would let it reach for `mapping.py`, which
    # is how a second entity-id scheme gets born.
    # `temporal` is a sibling too, for the same reason `consolidation` is: it
    # needs nothing from extraction. It reads entities through
    # `ports.graph_store` and computes over `domain.interval`. Above
    # `extraction` it could reach `mapping.py`, and the temptation there is
    # specific -- inferred edges would acquire a path into `DocumentExtracted`,
    # which is exactly the persistence decision `temporal/inference.py` argues
    # against.
    # `chunks` sits beside `graph` and `vector` rather than above or below
    # either. It holds the adapters for one more projection target -- the
    # stored passages a document was split into -- needs nothing from the
    # other two, and neither needs anything from it. A caller wanting a
    # chunk *and* the entities extracted from it holds both ports, which is
    # the same shape as every other cross-store question here and the reason
    # `graph` and `vector` are siblings in the first place. Note it is not
    # under `extraction`: `extraction.chunking.Chunk` is a transient split in
    # progress, `domain.chunk.StoredChunk` is a stored record, and the two
    # share four field names and no lifetime.
    "extraction : consolidation : temporal : chunks : graph : vector : llm",
    # Projections read the ports and the event schema and write nothing back:
    # nothing below them may import a projection, and they may not import an
    # adapter.
    "projections",
    # Aggregates are the write model: they import events and domain, and
    # nothing below them may import an aggregate.
    "aggregates",
    # `models` was a layer of its own here and `db` sat
    # on the line below; both went in slice 9, as did `schemas`
    # from the sibling line above. There is no ORM and no session for a layer
    # to be built around.
    # `cache` and `config` left this line in slice 10, with the modules.
    # `config.py` was a `pydantic_settings.BaseSettings` of 287 lines with four
    # keys anything read; `cache.py` was a module-level Redis singleton with no
    # caller at all. A library takes its configuration through constructor
    # arguments -- `tests/unit/test_library_reads_no_environment.py` is what
    # keeps that true now.
    # `cache`, `config`, `context` and `encryption` all left this line in
    # slice 10 with their modules -- a settings object, a Redis singleton, a
    # re-export shim, and a field-encryption service, none of them with a
    # caller. `events` is what is left, and it is the write model.
    "events",
    # Ports sit directly above `domain` and below every adapter: an adapter
    # (graph.adapters) may import its port, never the reverse.
    "ports",
    "domain",
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "The compliance suites see only the ports and the domain"
type = "forbidden"
# The other half of `testing`'s placement in the layers contract above, which
# only stops the library importing the suites and says nothing about what the
# suites import.
#
# A compliance suite states what a *port* promises. If it could import
# `redstring.graph`, the shortest route to a green suite would be to assert
# against `InMemoryGraphStore`'s behaviour -- and the whole reason these
# bodies are shared is that an in-memory reference which is more forgiving
# than a real backend lets an adapter pass on behaviour production does not
# have (`.claude/rules/recurring-defects.md` §1, and the `bytes`-not-`str`
# case in `testing/cache.py`).
#
# `ports` and `domain` are absent from this list deliberately: the suites are
# written in those two vocabularies and nothing else.
source_modules = ["redstring.testing"]
forbidden_modules = [
    "redstring.composition",
    "redstring.extraction",
    "redstring.consolidation",
    "redstring.temporal",
    "redstring.chunks",
    "redstring.graph",
    "redstring.vector",
    "redstring.llm",
    "redstring.projections",
    "redstring.aggregates",
    "redstring.events",
]
