[project]
name = "kg-builder"
version = "0.1.0"
description = "Knowledge graph construction: entity extraction, preprocessing, consolidation, and Neo4j sync."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.45,<3",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "pgvector>=0.2.0",
    "httpx>=0.25.0",
    "numpy>=1.26.0",
    "python-dateutil>=2.9.0",
    "dateparser>=1.2.0",
    "pyyaml>=6.0",
    "cryptography>=45.0",
    "redis[hiredis]>=5.3,<6",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.27,<6"]
openai = ["openai>=1.50.0"]
anthropic = ["anthropic>=0.42.0"]
# pinned <1.0: kg_builder.inference.providers uses the pre-1.0
# `pydantic_ai.models.openai.OpenAIModel` API.
# pinned to the version knowledge-mapper resolved; kg_builder.extraction and
# kg_builder.inference use the pre-1.0 pydantic-ai model API.
llm = ["pydantic-ai==0.0.31"]
nlp = ["jellyfish>=1.0.0"]
eventsourcing = ["eventsource-py[all]>=0.5.0"]
all = [
    "kg-builder[neo4j,openai,anthropic,llm,nlp,eventsourcing]",
]
dev = [
    "bandit[toml]>=1.9.4",
    "cosmic-ray>=8.4.6",
    "coverage[toml]>=7.15.3",
    "hypothesis>=6.165.0",
    "import-linter>=2.13",
    "mutmut>=3.7.0",
    "pre-commit>=4.6.1",
    "pytest>=9.0",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=7.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_builder"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    # UP042 wants `class X(str, Enum)` rewritten as `enum.StrEnum`. That is a
    # behaviour change, not a style fix: `str(X.A)` goes from "X.A" to "a",
    # which silently alters every f-string and log line holding a member. The
    # `(str, Enum)` idiom is used at 33 sites here, so this is a deliberate
    # migration to make wholesale with tests, not a drive-by autofix.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["kg_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The accuracy suite measures extraction quality against a live LLM, so it is
# excluded from the default run (and therefore from the commit gate). Run it
# deliberately with `uv run pytest -m accuracy tests/accuracy/` -- a CLI `-m`
# overrides this one.
addopts = ["-m", "not accuracy"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "accuracy: extraction accuracy tests",
    "slow: tests that take a long time to run",
]

[tool.coverage.run]
source = ["src/kg_builder"]
branch = true
parallel = true
omit = ["*/__pycache__/*"]

[tool.coverage.paths]
source = ["src/kg_builder", "*/src/kg_builder"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

# Mutation testing. Run on demand, not on commit -- see also cosmic-ray.toml,
# which covers decorated functions that mutmut 3.x refuses to mutate.
#   uv run mutmut run
#   uv run mutmut results
[tool.mutmut]
paths_to_mutate = ["src/kg_builder/"]
tests_dir = ["tests/unit/"]
runner = "uv run pytest -x -q --no-header -p no:randomly"
also_copy = ["pyproject.toml", "tests/conftest.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.importlinter]
root_packages = ["kg_builder"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "kg_builder.services",
    "kg_builder.extraction : kg_builder.graph : kg_builder.preprocessing : kg_builder.schemas",
    "kg_builder.inference",
    "kg_builder.models",
    "kg_builder.events : kg_builder.db : kg_builder.cache : kg_builder.encryption : kg_builder.config : kg_builder.context",
]
exhaustive = false
