[project]
name = "kg-builder"
version = "0.1.0"
description = "Knowledge graph construction: entity extraction, preprocessing, consolidation, and Neo4j sync."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.45,<3",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "pgvector>=0.2.0",
    "httpx>=0.25.0",
    "numpy>=1.26.0",
    "python-dateutil>=2.9.0",
    "dateparser>=1.2.0",
    "pyyaml>=6.0",
    "cryptography>=45.0",
    "redis[hiredis]>=5.3,<6",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.27,<6"]
# The LLM transport. `langchain-openai` speaks to any OpenAI-compatible
# server -- llama.cpp, llama-swap, vLLM, Ollama's shim, OpenAI itself -- so
# one extra covers every deployment this library has. Ranges rather than pins:
# the whole point of the `LlmProvider` port is that a breaking change touches
# `llm/adapters/langchain.py` and nothing else.
llm = [
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
]
nlp = ["jellyfish>=1.0.0"]
eventsourcing = [
    "eventsource-py>=0.9.1,<0.11",
]
all = [
    "kg-builder[neo4j,llm,nlp,eventsourcing]",
]
dev = [
    "bandit[toml]>=1.9.4",
    "cosmic-ray>=8.4.6",
    "coverage[toml]>=7.15.3",
    "hypothesis>=6.165.0",
    "import-linter>=2.13",
    "mutmut>=3.7.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.0",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=7.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_builder"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "DTZ",    # flake8-datetimez -- tz-aware is a domain invariant here
    "ERA",    # eradicate (commented-out code)
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "TC",     # flake8-type-checking
    "TID",    # flake8-tidy-imports
]
ignore = [
    # UP042 wants `class X(str, Enum)` rewritten as `enum.StrEnum`. That is a
    # behaviour change, not a style fix: `str(X.A)` goes from "X.A" to "a",
    # which silently alters every f-string and log line holding a member. The
    # `(str, Enum)` idiom is used at 33 sites here, so this is a deliberate
    # migration to make wholesale with tests, not a drive-by autofix.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",
    # Test functions do not earn return annotations: thousands of findings,
    # zero signal.
    "ANN",
    # hypothesis `st.datetimes(min_value=..., max_value=...)` bounds MUST be
    # naive, and strategies that generate naive datetimes to prove rejection
    # are the point. DTZ003 (utcnow) stays enforced everywhere.
    "DTZ001",
]

# Legacy packages pending deletion (slices 7/9). Each entry is removed in the
# commit that deletes its package -- this list may only shrink.
"src/kg_builder/models/**" = ["ANN", "TC"]
"src/kg_builder/services/**" = ["ANN", "TC", "RET", "ERA"]
"src/kg_builder/extraction/**" = ["ANN", "TC", "RET", "ERA"]
# Narrowed from `graph/**` in slice 3: graph/adapters/ is new architecture and
# is held to the full rule set.
"src/kg_builder/graph/client.py" = ["ANN", "TC", "RET"]
"src/kg_builder/graph/queries.py" = ["ANN", "TC", "RET"]
"src/kg_builder/schemas/**" = ["ANN", "TC"]
"src/kg_builder/events/**" = ["ANN", "TC"]

# Tests exercising the same legacy packages above. Same ratchet: each entry
# dies with the test module for the package it covers (slices 6-9).
"tests/unit/extraction/**" = ["PT", "PTH", "RET", "ERA"]
"tests/unit/models/**" = ["PT", "PTH", "RET"]
"tests/unit/schemas/**" = ["PT", "PTH", "RET"]
"tests/unit/services/**" = ["PT", "PTH", "RET", "ERA"]

[tool.ruff.lint.isort]
known-first-party = ["kg_builder"]

# datetime.utcnow() returns a NAIVE datetime and is deprecated from 3.12.
# DTZ003 catches the call form but not a bare reference such as
# `default_factory=datetime.utcnow`, which is how it reached this codebase
# (BACKLOG B29). Banning the attribute catches both shapes.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "Naive and deprecated since 3.12 — use datetime.now(UTC)."
"datetime.datetime.utcfromtimestamp".msg = "Naive — use datetime.fromtimestamp(ts, UTC)."

[tool.ruff.lint.flake8-type-checking]
# Pydantic BaseModel subclasses resolve their field annotations at runtime
# (schema building), so imports feeding those annotations must stay real
# imports, not TYPE_CHECKING-guarded ones -- TC001/TC003 would otherwise
# flag imports whose removal breaks pydantic at import time.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.13"
# Strict only where the new architecture lives. Legacy packages are excluded
# rather than weakened, and each exclusion dies with its package.
files = ["src/kg_builder"]
exclude = [
    "^src/kg_builder/(models|services|extraction|schemas|events)/",
    # graph/ is half legacy: the Neo4j client and Cypher templates predate the
    # rewrite, while graph/adapters/ is new architecture and is type-checked.
    "^src/kg_builder/graph/(client|queries)\\.py$",
]
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
# Pydantic 2.13 types well on its own, but the plugin adds checks plain mypy
# cannot do -- above all `init_typed`, which validates constructor CALLS
# against field types. Without it `Entity(confidence="high")` type-checks
# clean and only fails at runtime, which defeats the point of typing a
# domain model whose whole job is enforcing invariants.
plugins = ["pydantic.mypy"]

# asyncpg ships no `py.typed`, so mypy cannot see its types at all. The
# alternative is a stub package, which would have to track asyncpg's releases
# for the sake of one adapter; `kg_builder.vector.adapters.pgvector` is the
# only module that imports it, and its own signatures are fully annotated.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The accuracy suite measures extraction quality against a live LLM, and the
# integration suite runs the port-compliance tests against real backends from
# `docker-compose.test.yml`. Both are excluded from the default run (and so
# from the commit gate), which keeps it infra-free and fast. Run them
# deliberately -- a CLI `-m` overrides this one:
#
#     uv run pytest -m accuracy tests/accuracy/
#     KG_COMPLIANCE_MAX_EXAMPLES=10 uv run pytest -m integration
addopts = ["-m", "not accuracy and not integration"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "accuracy: extraction accuracy tests",
    "slow: tests that take a long time to run",
]

[tool.coverage.run]
source = ["src/kg_builder"]
branch = true
parallel = true
omit = [
    "*/__pycache__/*",
    # Deliberately NOT omitted: `graph/adapters/neo4j.py`. Most of it is
    # exercised by `tests/unit/graph/test_neo4j_adapter_is_wired.py`, which
    # runs in the default gate; the rest needs a server. Omitting it would
    # have hidden the untested remainder, which is the opposite of what a
    # ratchet is for. See BACKLOG B10a.
]

[tool.coverage.paths]
source = ["src/kg_builder", "*/src/kg_builder"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

# Mutation testing. Run on demand, not on commit -- see also cosmic-ray.toml,
# which covers decorated functions that mutmut 3.x refuses to mutate.
#   uv run mutmut run
#   uv run mutmut results
[tool.mutmut]
paths_to_mutate = ["src/kg_builder/"]
tests_dir = ["tests/unit/"]
runner = "uv run pytest -x -q --no-header -p no:randomly"
also_copy = ["pyproject.toml", "tests/conftest.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.importlinter]
root_packages = ["kg_builder"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "kg_builder.services",
    # `llm` is a sibling of `extraction` rather than beneath it, and that is
    # the load-bearing part: siblings may not import each other, so extraction
    # can depend only on `kg_builder.ports.llm_provider`. Putting `llm` lower
    # would let extraction import the LangChain adapter directly and undo the
    # port. Note that import-linter cannot see the *external* langchain
    # imports; `tests/unit/llm/test_port_does_not_leak.py` covers those.
    "kg_builder.extraction : kg_builder.graph : kg_builder.vector : kg_builder.llm : kg_builder.schemas",
    # Projections read the ports and the event schema and write nothing back:
    # nothing below them may import a projection, and they may not import an
    # adapter.
    "kg_builder.projections",
    # Aggregates are the write model: they import events and domain, and
    # nothing below them may import an aggregate.
    "kg_builder.aggregates",
    "kg_builder.models",
    "kg_builder.events : kg_builder.db : kg_builder.cache : kg_builder.encryption : kg_builder.config : kg_builder.context",
    # Ports sit directly above `domain` and below every adapter: an adapter
    # (kg_builder.graph.adapters) may import its port, never the reverse.
    "kg_builder.ports",
    "kg_builder.domain",
]
exhaustive = false
