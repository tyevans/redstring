# Cosmic Ray mutation testing.
#
# Complements mutmut: cosmic-ray mutates decorated functions, which mutmut 3.x
# skips. Runs on demand, not on commit.
#
#   uv run cosmic-ray init cosmic-ray.toml session.sqlite
#   uv run cosmic-ray exec cosmic-ray.toml session.sqlite
#   uv run cr-report session.sqlite

[cosmic-ray]
module-path = "src/redstring"
# 120s, not 30. cosmic-ray records a timeout as KILLED and `cr-report` does
# not distinguish it, so a timeout that is really "the machine was busy"
# reports as a caught mutant. At 30s against a ~7s baseline, a concurrent test
# suite was enough to time out 132 of 159 mutants in one session and all 80 in
# another -- both read as clean runs. `scripts/mutation.py` now refuses a
# result whose kills are mostly timeouts; this is the other half of that fix.
timeout = 120.0
test-command = "uv run pytest -x -q --no-header -p no:randomly tests/unit"
excluded-modules = []

[cosmic-ray.distributor]
name = "local"
